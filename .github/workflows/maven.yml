name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo files (debug)
        run: |
          echo "PWD: $(pwd)"
          echo "Top-level files:"
          ls -la
          echo ""
          echo "Searching for pom.xml (excluding .github)..."
          find . -path './.github' -prune -o -name 'pom.xml' -print

      - name: Detect Maven project
        id: detect_pom
        run: |
          set -euo pipefail
          echo "Searching for pom.xml (excluding .github)..."
          POM_PATH=$(find . -path './.github' -prune -o -name 'pom.xml' -print | head -n 1 || true)
          if [ -z "${POM_PATH:-}" ]; then
            echo "ERROR: pom.xml not found in repository."
            echo "Searched with: find . -path './.github' -prune -o -name 'pom.xml'"
            exit 1
          fi
          POM_DIR=$(dirname "$POM_PATH")
          echo "Found pom.xml at: $POM_PATH (project dir: $POM_DIR)"
          echo "pom_dir=$POM_DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (auto-detect pom)
        working-directory: ${{ steps.detect_pom.outputs.pom_dir }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Building in $(pwd)"
          if [ -f "./mvnw" ] && [ ! -x "./mvnw" ]; then
            chmod +x ./mvnw
          fi
          if [ -x "./mvnw" ]; then
            echo "Using Maven wrapper (mvnw) from project"
            ./mvnw -B package
          else
            echo "Using system mvn"
            mvn -B package
          fi

      - name: Update dependency graph
        if: success()
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
        working-directory: ${{ steps.detect_pom.outputs.pom_dir }}
